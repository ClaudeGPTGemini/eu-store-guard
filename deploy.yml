name: Deploy Worker DEV

# Disparo exclusivamente manual: el primer despliegue debe ser deliberado y sin
# EVALUATE_TOKEN, para certificar el fallo cerrado (503) en el Worker real.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers (DEV)
        run: npx wrangler deploy --config apps/worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
